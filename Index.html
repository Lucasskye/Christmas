<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Merry Christmas 2025</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: monospace;
      text-align: center;
      margin: 0;
      padding: 2em;
    }

    .tree {
      white-space: pre;
      font-size: 16px;
      line-height: 1;
    }

    .tree .star { color: gold; }
    .tree .leaf { color: limegreen; }
    .tree .trunk { color: sienna; }

    .message {
      margin-top: 2em;
      font-size: 2em;
      color: #aaf;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .blink {
      animation: blink 1.5s infinite;
    }
  </style>
</head>
<body>

  <div class="tree">
<span class="star">       ★</span><br>
<span class="leaf">      ▲ ▲</span><br>
<span class="leaf">     ▲ ▲ ▲</span><br>
<span class="leaf">    ▲ ▲ ▲ ▲</span><br>
<span class="leaf">   ▲ ▲ ▲ ▲ ▲</span><br>
<span class="leaf">  ▲ ▲ ▲ ▲ ▲ ▲</span><br>
<span class="leaf"> ▲ ▲ ▲ ▲ ▲ ▲ ▲</span><br>
<span class="leaf">▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲</span><br>
<span class="trunk">       ││</span><br>
<span class="trunk">       ││</span>
  </div>

  <div class="message blink">
    Merry Christmas 2025!
  </div>

</body>
</html>
